# Wilderness -- Apple II+ 48 KB / DOS 3.3, BRUN at $6000.
#   $2000-$3FFF  HGR page 1: view on rows 0..159, 4 text rows below (mixed)
#   $1000-$1FFF  WILDLO, BLOADed by HELLO: row table, unrolled span code
#   $6000-$6FFF  program (CODE, RODATA, DATA, BSS)
#   $7000-$94FF  MAP file, BLOADed by HELLO: 64-byte header + 112 x 84 grid
#   $9600-$BFFF  DOS 3.3
MEMORY {
    ZP:     start = $0050, size = $00B0, type = rw, define = yes;
    LOW:    start = $1000, size = $1000, type = rw, file = "build/wildlo.bin";
    MAIN:   start = $6000, size = $1000, type = rw, define = yes, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    LOWDATA:  load = LOW,  type = ro, align = $100;
    LOWCODE:  load = LOW,  type = ro;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro, optional = yes;
    DATA:     load = MAIN, type = rw, optional = yes;
    BSS:      load = MAIN, type = bss, optional = yes, define = yes;
}
