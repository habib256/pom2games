# MB TRACKER: a ProDOS SYS image linked to run where sysboot.s loads it
# ($2000: no relocation; text screen only, no graphics pages).
# Main $0800-$0FFF: crt0's zero-page save (ZPSAVE), the encoder's tables
# and the audition song (LOW8BSS). $1000-$1FFF (pages
# crt0 leaves free in the system bitmap: MLI buffers): the OPEN buffer,
# the directory block, the prefix, the current pattern and the encoder's
# scratch pattern (LOWBSS). $2000-$8DFF: code and data (src/entry.s's
# jump, then RODATA: /RAM's FORMAT at the exit overwrites $2000-$21FF). $8E00-$BDFF: the
# song's AYS bytes (12 KB, SONGBUF). C stack $BE00-$BEFF, ProDOS $BF00.
# $7CF0-$8DFF: the overlay run area (OVL1 the instrument editor, OVL2 the
# file screens and the AYS decoder: MBT.OVL, kept in the aux language card,
# fetched by main.c's ovl_use). Aux (/RAM disconnected): $0800-$97FF the
# patterns (src/song.c), $9800 the help, $A100 the block clipboard, $A580
# the undo pattern; aux LC bank 1 $D000-$F21F the overlays (src/mbt.h).
FEATURES {
    STARTADDRESS: default = $2000;
    CONDES: type=constructor, label=__CONSTRUCTOR_TABLE__, count=__CONSTRUCTOR_COUNT__, segment=ONCE;
    CONDES: type=destructor,  label=__DESTRUCTOR_TABLE__,  count=__DESTRUCTOR_COUNT__,  segment=RODATA;
    CONDES: type=interruptor, label=__INTERRUPTOR_TABLE__, count=__INTERRUPTOR_COUNT__, segment=RODATA, import=__CALLIRQ__;
}
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0100;
    __STACKSTART__: type = weak, value = $BF00;
}
MEMORY {
    ZP:     start = $0050, size = $00B0, type = rw, define = yes;
    LOW8:   start = $0800, size = $0800, type = rw, define = yes;
    LOWRAM: start = $1000, size = $1000, type = rw, define = yes;
    RAM:    start = $2000, size = $5CF0, type = rw, define = yes, file = %O;
    OV1:    start = $7CF0, size = $1110, type = ro, define = yes, file = "%O.ovl", fill = yes;
    OV2:    start = $7CF0, size = $1110, type = ro, define = yes, file = "%O.ovl", fill = yes;
    SONG:   start = $8E00, size = $3000, type = rw, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    IOBUF:    load = LOWRAM, type = bss, align = $100;
    LOWBSS:   load = LOWRAM, type = bss, define = yes;
    ENTRY:    load = RAM,    type = ro;
    RODATA:   load = RAM,    type = ro,  define = yes;   # >= 512 B: /RAM's FORMAT buffer at the exit
    STARTUP:  load = RAM,    type = ro,  define = yes;
    LOWCODE:  load = RAM,    type = ro,  optional = yes;
    INIT:     load = RAM,    type = ro,  optional = yes;
    ONCE:     load = RAM,    type = ro,  optional = yes;
    CODE:     load = RAM,    type = ro;
    DATA:     load = RAM,    type = rw,  define = yes;
    BSS:      load = RAM,    type = bss, define = yes;
    ZPSAVE:   load = LOW8,   type = bss;
    LOW8BSS:  load = LOW8,   type = bss;
    SONGBUF:  load = SONG,   type = bss;
    OVL1:     load = OV1,    type = ro;
    OVL2:     load = OV2,    type = ro;
}
