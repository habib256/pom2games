# VERHILLE Arnaud — GPL-3.0. Hall of fame bench (ProDOS, loaded by NEOHOF.SYSTEM).
# HOFTEST at $4000: bench, game stand-ins, loader fragment, module_end.
# NEOWILD.END at $9600: the module src/hof.s (HOF_BENCH), read from the disk
# by module_end like in the game. Not in any file: $2000 (loader buffer),
# $5800 (module buffer), $7000 (map header), $8000 (SCENE, by the loader).
MEMORY {
    ZP:     file = "", start = $00E0, size = $0010, type = rw;
    BENCH:  file = %O, start = $4000, size = $1800, type = rw;
    HOFMOD: file = "build/hof/NEOWILD.END", start = $9600, size = $1F00, type = rw;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    CODE:     load = BENCH,  type = rw;
    HOF:      load = HOFMOD, type = rw, define = yes;
}
