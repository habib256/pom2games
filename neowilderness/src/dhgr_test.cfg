# VERHILLE Arnaud — GPL-3.0. Standalone DHGR column bench (ProDOS, loaded by NEODHGR.SYSTEM).
# START is $7400; the script is loaded below it (src/dhgr_test.s SCRIPT).
SYMBOLS {
    __START__: type = weak, value = $7400;
}
MEMORY {
    ZP:   file = "", start = $0080, size = $0040, type = rw;
    MAIN: file = %O, start = __START__, size = $9600 - __START__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    STARTUP:  load = MAIN, type = ro;
    CODE:     load = MAIN, type = ro;
    DCCODE:   load = MAIN, type = ro;
    DCROWS:   load = MAIN, type = rw, define = yes;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    BSS:      load = MAIN, type = bss;
    DCBSS:    load = MAIN, type = bss, optional = yes;
}
