# VERHILLE Arnaud — GPL-3.0. NEO*.SYSTEM (src/bench_boot.s): ProDOS SYS file at $2000,
# loader part relocated to $0800-$09FF before it loads the bench.
MEMORY {
    IMAGE: start = $2000, size = $0400, type = ro, file = %O;
    WORK:  start = $0800, size = $0200, type = rw, file = "";
}
SEGMENTS {
    CODE:   load = IMAGE, type = ro;
    LOADER: load = IMAGE, run = WORK, type = ro, define = yes;
}
