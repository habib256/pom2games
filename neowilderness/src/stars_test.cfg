# VERHILLE Arnaud — GPL-3.0. Standalone star bench (ProDOS, loaded by NEOSTARS.SYSTEM).
# One file STARTEST loaded at $4000: bench and engine pieces, an empty
# $5800-$5FFF (the game's module window), the rest of the engine, then the
# head of the star catalogue at $8000 and the star module (src/stars.s: the
# rest of the catalogue, code and tables) right after it, as the game
# places them in the SIM window from $9600; its BSS from $8C00. Case records
# (SCENE) are loaded at $A000.
MEMORY {
    ZP:     file = "", start = $0050, size = $0060, type = rw;
    LOW:    file = %O, start = $4000, size = $1800, type = rw, fill = yes;
    GAP:    file = %O, start = $5800, size = $0800, type = rw, fill = yes;
    MAIN:   file = %O, start = $6000, size = $2000, type = rw, fill = yes;
    CAT:    file = %O, start = $8000, size = $01CE, type = rw;
    MOD:    file = %O, start = $81CE, size = $0A32, type = rw;
    TMP:    file = "", start = $8C00, size = $1400, type = rw;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    STARTUP:  load = LOW,  type = ro;
    LOWCODE:  load = LOW,  type = ro;
    LOWTEXT:  load = LOW,  type = rw;
    LOWPAGE:  load = LOW,  type = ro;
    CODE:     load = MAIN, type = ro;
    GCODE:    load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro, optional = yes;
    DATA:     load = MAIN, type = rw, optional = yes;
    GDATA:    load = MAIN, type = rw;
    BSS:      load = MAIN, type = bss, define = yes;
    RESBSS:   load = MAIN, type = bss, optional = yes;   # dhgr.s band variables (game: RESIDENT)
    SKYCAT:   load = CAT,  type = rw;
    SKYCAT2:  load = MOD,  type = rw;
    SKYSTARS: load = MOD,  type = rw, define = yes;
    SKYSTBSS: load = TMP,  type = bss, align = $100, define = yes;
}
