# Neowilderness -- Apple IIe enhanced / IIc 128 KB, ProDOS 8.
# Main RAM (see docs/MEMORY.md for the complete plan and byte counts):
#   $0200-$03CF  LOWPAGE: video modes, 80/40-column text, curtain (lot 4);
#                free of ProDOS and the Monitor while the game runs
#   $0800-$0925  woodland mask
#   $0926-$09FF  resident woodland helpers
#   $0A00-$0FFF  WILDTXT: messages and screen words (game.s)
#   $1000-$1FFF  WILDLO: projection table, unrolled DHGR rows (dhgr.s), clear
#                of both banks, resident LOOK
#   $2000-$3FFF  main half of the single DHGR page (view, HUD rows 0..15,
#                cache rows 160..175, 4 mixed text rows); TOPO draws its
#                sheet on rows 0..159. No code or data.
#   $4000-$577F  WILDGAME: resident game logic and state (game.s, gamedata.inc)
#   $5780-$57FF  REGIONTEXT: texts of the chosen region, written by its pack
#                (NEOWILD.Rn, lot 7): name, fauna sentence, species names
#   $5800-$5FFF  module execution window (copied from auxiliary RAM; on
#                NeoWildernessXL, CAMP/MEDVIEW/TREE/ORIENT are read there by
#                block from NEOWILD.BLK, docs/MEMORY.md 14)
#   $6000-$6FFF  WILDERNESS: view engine (wild.s); the start and the /RAM
#                claim are the loader's, the exit is INPUT's (docs/MEMORY.md 15)
#   $7000-$94FF  WILDMAP: 64-byte header + 112 x 84 grid
#   $9500-$95FF  scratch: sprite column / sky floats / text
#   $9600-$B5FF  SIM execution window (ENVIRON + THERMAL), copied from
#                auxiliary RAM on activation; NEOWILD.SYSTEM runs here first;
#                TOPOGEN (module 0: TOPO sheet, view snapshot) runs here too;
#                $B000-$B5FF: the grid of the menu (menu.s MENUSWAP) between
#                two simulation steps, copied from the hidden HGR rows
#   $B600-$B9FF  RESIDENT: RAM transfers, module directory, MLI accounting,
#                the RESET relay (the exit itself is in INPUT)
#   $BA00-$BDFF  WILDMENU: the four 80-column rows as a command surface
#                (menu.s, lot 8); the ProDOS I/O buffer of NEOWILD.END and
#                NEOWILD.HOF at the end of a journey (the loader has its own)
#   $BE00-$BEFF  zero page of ProDOS, restored at exit
#   $BF00-$BFFF  ProDOS global page
# Auxiliary RAM: module store ($0800-$1FFF, $4000-$BFFF, language card
# bank 2 $D000-$DFFF, common area $F100-$FFF9); bank 1 and $E000-$F0FF hold
# the compressed snapshot of the view while TOPO is shown (src/topo_dhgr.s)
# on a legacy map; on a native map, they hold the fine geography instead
# (src/geoaux.s: tile cache, decoder, atlas) and TOPO redraws the view.
# Main language card bank 2 $D400-$DFFF (free of ProDOS 8): more of the module
# store, and the star list and drawing code at $DE18 (lot 7); $D001-$D0FF,
# which ProDOS 8 never uses either: the LZ decoder (docs/MEMORY.md 14);
# $D100-$D3FF, ProDOS's QUIT code, put aside in the store's exit state while
# the game runs five routines of the view there (docs/MEMORY.md 15).
# Auxiliary $2000-$3FFF is the aux half of the DHGR page and $0400-$07FF the
# even columns of the mixed text rows, both reached through PAGE2 under
# 80STORE; $0000-$03FF is never written (ProDOS /RAM driver).
# Zero page: $50-$CF view scratch (the ROM floating point routines of the
# game reuse $5E-$AC between views), $D0-$EF game, $F0-$F8 the menu's
# drawing temporaries (menu.s; Applesoft and the ROM never read $F0-$FF).
MEMORY {
    ZP:     start = $0050, size = $0080, type = rw, define = yes;
    GZP:    start = $00D0, size = $0020, type = rw;
    MZP:    start = $00F0, size = $0010, type = rw;
    LOWPG:  start = $0200, size = $01D0, type = rw, file = "build/wildpg.bin";
    WOODS: start = $0800, size = $0126, type = rw, file = "";
    FOREST: start = $0926, size = $00DA, type = rw, file = "build/wildforest.bin";
    TEXT:   start = $0A00, size = $0600, type = rw, file = "build/wildtxt.bin";
    LOW:    start = $1000, size = $1000, type = rw, file = "build/wildlo.bin";
    GAME:   start = $4000, size = $1780, type = rw, file = "build/wildgame.bin";
    REGTXT: start = $5780, size = $0080, type = rw, file = "";
    VOC:    start = $5800, size = $0800, type = rw, file = "build/wildvoc.bin";
    SIM:    start = $9600, size = $2000, type = rw, file = "build/wildsim.bin";
    SITES:  start = $5800, size = $0800, type = rw, file = "build/wildsit.bin";
    PROJECT: start = $5800, size = $0800, type = rw, file = "build/wildprj.bin";
    INPUT: start = $5800, size = $0800, type = rw, file = "build/wildinp.bin";
    ITEMS: start = $5800, size = $0800, type = rw, file = "build/wilditm.bin";
    SUMMARY: start = $5800, size = $0800, type = rw, file = "build/wildhud.bin";
    # STATUS (80 columns) runs in the SIM window, below the menu's $B000
    # (scr_status: a direct mem_fetch, like TOPOGEN; SIM is reloaded later).
    STATUS: start = $9600, size = $1B00, type = rw, file = "build/wildsta.bin";
    # NeoWildernessXL only (docs/MENUS.md 9, src/mousetext.inc): the tail of
    # STATUS (the MouseText pages, src/mt_pages.s), of CRAFT and of MEDVIEW,
    # appended by tools/build_disk.py to the XL copies of those images; the
    # bytes XL changes in the shared images (XLPATCH, never loaded). STATX
    # runs over the menu's $B000-$B5FF, as SIM does (get_line gathers it).
    STATX:  start = $B100, size = $0500, type = rw, file = "build/wildstx.bin";
    CRAFTX: start = $A700, size = $0900, type = rw, file = "build/wildcrx.bin";
    MEDVX:  start = $5FC0, size = $0040, type = rw, file = "build/wildmvx.bin";
    ENDX:   start = $A400, size = $0200, type = rw, file = "build/wildendx.bin";
    XLP:    start = $0000, size = $2000, type = rw, file = "build/wildxlp.bin";
    XLZ:    start = $0000, size = $0400, type = rw, file = "build/wildxlz.bin";
    # NeoWildernessXL: resident code copied over code XL never runs (build_disk XL_COPIES).
    XLR:    start = $0000, size = $0100, type = rw, file = "build/wildxlr.bin";
    TRAVEL: start = $5800, size = $0800, type = rw, file = "build/wildtrv.bin";
    # Fine geography (lot 5, native maps only): auxiliary language card, bank 1
    # view, after the 4-tile cache at $D000-$D47F; build_disk.py appends the
    # atlas. Shared with the snapshot of the view under TOPO, which native
    # maps do without (src/topo_dhgr.s tp_save).
    GEOLC: start = $D480, size = $1C80, type = rw, file = "build/wildgeo.bin";
    MEDICAL: start = $5800, size = $0800, type = rw, file = "build/wildmed.bin";
    EQUIPMENT: start = $5800, size = $0800, type = rw, file = "build/wildeqp.bin";
    TREE: start = $5800, size = $0800, type = rw, file = "build/wildtre.bin";
    # Orientation (lot 7; module 26 since the memory reclaim, docs/MEMORY.md 13).
    ORIENTM: start = $5800, size = $0800, type = rw, file = "build/wildori.bin";
    # Health alerts of lot 13 (module 27, docs/MEMORY.md 13).
    ALERTM: start = $5800, size = $0800, type = rw, file = "build/wildalr.bin";
    # The text bank (src/textbank.txt, tools/gentextbank.py, docs/MEMORY.md 13): an image of the store
    # (directory entry 28), never run: its labels are offsets.
    TBANK: start = $0000, size = $2000, type = rw, file = "build/wildtxb.bin";
    MEDVIEW: start = $5800, size = $0800, type = rw, file = "build/wildmvi.bin";
    ADVENTURE: start = $5800, size = $0800, type = rw, file = "build/wildadv.bin";
    OUTDOOR: start = $5800, size = $0800, type = rw, file = "build/wildout.bin";
    CAMP: start = $5800, size = $0800, type = rw, file = "build/wildcamp.bin";
    SCRATCH: start = $9500, size = $0100, type = rw, file = "";
    TOPOGEN: start = $9600, size = $2000, type = rw, file = "build/wildtpg.bin";
    HOF:     start = $9600, size = $2000, type = rw, file = "build/wildhof.bin";
    # SAVE/RESTORE (lot 9, src/save.s): NEOWILD.SAV, read from the disk at the command.
    SAVMOD:  start = $9600, size = $0600, type = rw, file = "build/wildsav.bin";
    # Hunting, fishing, gathering, meals (lot 4, src/frg.s): directory entry
    # 31, read by block from NEOWILD.BLK at each command (both editions).
    # The animated campfire (src/fire.s, tools/genfire.py): directory entry
    # 18, read from NEOWILD.BLK into the SIM window at a prompt with a fire
    # (both editions); its buffers follow at $A000-$A2BB.
    FIREM:   start = $9600, size = $0A00, type = rw, file = "build/wildfire.bin";
    FRG:     start = $9600, size = $1A00, type = rw, file = "build/wildfrg.bin";
    # The MAKE recipes of lot 3 (src/craft.s, docs/CRAFT.md): directory entry 9,
    # read from NEOWILD.BLK by CAMP (camp_craft) on both editions; its first
    # blocks only (the entry's length ends at craft_page), all of them, up to
    # $A1FF over the campfire's buffers (the fire is hidden then), for the
    # CRAFT page (src/pages.s pg_craft), below GRID ($A300).
    CRAFTM:  start = $9600, size = $1100, type = rw, file = "build/wildcrf.bin";
    # The grid's lists, composition and queue (src/grid.s, docs/MEMORY.md 18):
    # directory entry 32, copied at each RETURN in the grid and each step of
    # its queue into the SIM window, above the campfire's buffers ($A000-$A2BB)
    # and below the grid's own image (MENUSWAP, $B000).
    GRIDM:   start = $A300, size = $0D00, type = rw, file = "build/wildgrid.bin";
    # Night stars (lot 7 step 5, docs/STARS.md): the hourly module (ID 25)
    # and the first 154 stars of its catalogue (ID 24, a record of its own
    # of 462 bytes, the size of a hole of the store), run in the SIM window,
    # free while the simulation is not loaded, with their tables in BSS: the
    # catalogue continues at the head of the module image ($97CE); the
    # visible list and the per-column drawing code, which runs in place, in
    # bank 2 of the MAIN language card ($DE18, left free by ProDOS 8 like
    # $D400-$DE17, where module images go; docs/MEMORY.md 9.7).
    SKYCAT:   start = $9600, size = $01CE, type = rw, file = "build/wildskycat.bin";
    SKYSTARS: start = $97CE, size = $0A32, type = rw, file = "build/wildsky.bin";
    SKYTMP:   start = $A200, size = $0E00, type = rw, file = "";
    SKYLC:    start = $DE18, size = $01E8, type = rw, file = "build/wildskylc.bin";
    # Direction 3 (docs/MEMORY.md section 12): the unrolled DHGR rows and
    # their entry tables run in place in bank 2 of the main language card,
    # followed by the lunar ephemeris (LCDATA, read by SIM); the module
    # store keeps the rest of $D400-$DE17 (tools/build_disk.py).
    DROWS:    start = $D400, size = $0A18, type = rw, file = "build/wilddrows.bin";
    # docs/MEMORY.md 14: the LZ decoder of mem_fetch (memory.s lzc_entry) runs
    # in place in the unused page of that bank, past ProDOS's signature byte
    # $D000 and below its QUIT code ($D100-$D3FF).
    LZLC:     start = $D001, size = $00FF, type = rw, file = "build/wildlzlc.bin";
    # docs/MEMORY.md 15: ProDOS's QUIT code area $D100-$D3FF of that bank,
    # put aside by the loader at the claim and back at every exit: five pure
    # routines of the view run there (src/dhgr.s B2_ENTRY).
    B2LC:     start = $D100, size = $0300, type = rw, file = "build/wildb2.bin";
    RESIDENT: start = $B600, size = $0400, type = rw, define = yes, file = "build/wildres.bin";
    IOBUF:  start = $BA00, size = $0400, type = rw, file = "";
    MENU:   start = $BA00, size = $0400, type = rw, file = "build/wildmenu.bin";
    # The grid and its lists run at the top of the SIM window between two
    # simulation steps; the loader reads the image at $AF00 and hides it in
    # the HGR rows 176-191 (menu.s); SKYTMP stops below it.
    SWAP:   start = $B000, size = $0600, type = rw, file = "build/wildmenusw.bin";
    # ProDOS's zero page at entry; during the game, HICODE (docs/MEMORY.md 13:
    # the zero page waits in auxiliary $BF00, outside the store).
    SAVE:   start = $BE00, size = $0100, type = rw, file = "";
    HIGH:   start = $BE00, size = $0100, type = rw, file = "build/wildhi.bin";
    MAIN:   start = $6000, size = $1000, type = rw, define = yes, file = %O;
    # NEOWILD.SYSTEM: ProDOS loads it at $2000; the stub moves the loader to
    # the SIM window, which is free until the first simulation transfer.
    # The loader (menu included) and its BSS end below its record table
    # (boot.s TABLE = $B500).
    # NEOWILD.PRE (fidelity lot 1, src/prepare.s): the journey preparation,
    # read by the loader at $2000 (its staging buffer, free once the region
    # pack is read) for a journey other than the frozen first one, run there
    # before the grid of the menu is moved into the HGR rows.
    PREP:    start = $2000, size = $1F00, type = rw, file = "build/wildpre.bin";
    SYSFILE: start = $2000, size = $1F00, type = rw, file = "build/NEOWILD.SYSTEM";
    SYSRUN:  start = $9600, size = $1F00, type = rw, file = "";
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    GZP:      load = GZP,  type = zp;
    MZP:      load = MZP,  type = zp;
    LOWPAGE:  load = LOWPG, type = rw;
    WOODS: load = WOODS, type = bss;
    FORESTCODE: load = FOREST, type = rw;
    TEXT:     load = TEXT, type = rw;
    LOWDATA:  load = LOW,  type = ro, align = $100;
    LOWCODE:  load = LOW,  type = ro;
    LOWTEXT:  load = LOW,  type = rw;
    LOWCACHE: load = LOW, type = bss;
    GCODE:    load = GAME, type = ro;
    GDATA:    load = GAME, type = rw;
    VOCAB:    load = VOC, type = ro;
    ENVIRON:  load = SIM, type = rw;
    THERMAL:  load = SIM, type = rw;
    SITES:    load = SITES, type = rw;
    PROJECT:  load = PROJECT, type = rw;
    TRAVEL:   load = TRAVEL, type = rw;
    GEOAUX:   load = GEOLC, type = rw;
    MEDICAL:  load = MEDICAL, type = rw;
    HAZARDS:  load = MEDICAL, type = rw;
    EQUIPMENT: load = EQUIPMENT, type = rw;
    TREE: load = TREE, type = rw;
    ORIENT: load = ORIENTM, type = rw;
    ALERT: load = ALERTM, type = rw;
    TBINDEX: load = TBANK, type = rw;
    TEXTBANK: load = TBANK, type = rw;
    MEDVIEW:  load = MEDVIEW, type = rw;
    INPUT: load = INPUT, type = rw;
    ITEMS: load = ITEMS, type = rw;
    SUMMARY: load = SUMMARY, type = rw;
    STATUS: load = STATUS, type = rw;
    STATX:  load = STATX, type = rw;
    CRAFTX: load = CRAFTX, type = rw;
    MEDVX:  load = MEDVX, type = rw;
    ENDX:   load = ENDX, type = rw;
    XLPATCH: load = XLP, type = rw;
    XLZERO: load = XLZ, type = rw;
    XLRES:  load = XLR, type = rw;
    ADVENTURE: load = ADVENTURE, type = rw;
    OUTDOOR: load = OUTDOOR, type = rw;
    CAMP: load = CAMP, type = rw;
    SCRATCH:  load = SCRATCH, type = bss;
    TOPOGEN:  load = TOPOGEN, type = rw;
    TOPOBSS:  load = TOPOGEN, type = bss, align = $100;
    HOF:      load = HOF, type = rw;
    SAVEMOD:  load = SAVMOD, type = rw;
    FORAGE:   load = FRG, type = rw;
    CRAFT:    load = CRAFTM, type = rw;
    GRID:     load = GRIDM, type = rw, align = $100;
    FIRE:     load = FIREM, type = rw;
    SKYCAT:   load = SKYCAT, type = rw;
    SKYCAT2:  load = SKYSTARS, type = rw;
    SKYSTARS: load = SKYSTARS, type = rw;
    SKYSTBSS: load = SKYTMP, type = bss, align = $100;
    SKYRES:   load = SKYLC, type = rw;
    DROWS:    load = DROWS, type = rw;
    LCDATA:   load = DROWS, type = rw;
    LZCODE:   load = LZLC, type = rw;
    B2CODE:   load = B2LC, type = rw;
    RESCODE:  load = RESIDENT, type = rw;
    RESBSS:   load = RESIDENT, type = bss, define = yes;
    IOBUF:    load = IOBUF, type = bss, define = yes;
    MENUCODE: load = MENU, type = rw;
    MENUSWAP: load = SWAP, type = rw;
    SAVE:     load = SAVE, type = bss, define = yes;
    HICODE:   load = HIGH, type = rw;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro, optional = yes;
    DATA:     load = MAIN, type = rw, optional = yes;
    BSS:      load = GAME, type = bss, optional = yes, define = yes;
    REGIONTEXT: load = REGTXT, type = bss, define = yes;
    SYSSTUB:  load = SYSFILE, type = ro;
    LOADER:   load = SYSFILE, run = SYSRUN, type = rw, define = yes;
    LOADBSS:  load = SYSRUN, type = bss, define = yes;
    PREPARE:  load = PREP, type = rw, define = yes;
}
