# ProDOS .SYSTEM shim (dev/lib/prodos/sysboot.s): entry at $2000, the
# loader part (at most 255 bytes) copied to $0800 and run there (READ
# overwrites $2000), its buffers (LOADBSS) right after it.
MEMORY {
    IMAGE: start=$2000, size=$9F00, type=ro, file=%O;
    WORK: start=$0800, size=$0200, type=rw, file="";
}
SEGMENTS {
    CODE: load=IMAGE, type=ro;
    LOADER: load=IMAGE, run=WORK, type=ro, define=yes;
    LOADBSS: load=WORK, type=bss;
}
