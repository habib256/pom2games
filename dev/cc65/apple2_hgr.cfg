# cc65 linker config — Apple II+ 48 KB / DOS 3.3, hi-res program (BRUN at $6000)
# -----------------------------------------------------------------------------
# One binary above the two HGR pages, loaded and started by DOS with BRUN.
#
#   $0000-$004F  Monitor / DOS zero page         -- left alone (COUT works)
#   $0050-$00FF  ZEROPAGE (176 B, Applesoft's)   -- restore with exit.asm
#   $0100-$01FF  6502 stack
#   $0200-$02FF  input buffer                    -- free while the game runs
#   $0300-$03FF  DOS / Monitor vectors           -- never touched
#   $0400-$07FF  text page 1                     -- COUT output
#   $0800-$0FFF  BASIC greeting program (HELLO)  -- kept by DOS, never touched
#   $1000-$1FFF  LOWBSS (4 KB)                    -- big uninitialised tables
#   $2000-$3FFF  HGR page 1
#   $4000-$5FFF  HGR page 2
#   $6000-$95FF  CODE + RODATA + DATA (the BRUN file), then BSS
#   $9600-$BFFF  DOS 3.3
#
# Output: raw binary loaded at $6000; dev/tools/dos33.py adds the DOS header.
MEMORY {
    ZP:     start = $0050, size = $00B0, type = rw, define = yes;
    LOWRAM: start = $1000, size = $1000, type = rw, define = yes;
    MAIN:   start = $6000, size = $3600, type = rw, define = yes, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    LOWBSS:   load = LOWRAM, type = bss, optional = yes, define = yes;
    CODE:     load = MAIN,   type = ro;
    RODATA:   load = MAIN,   type = ro,  optional = yes;
    DATA:     load = MAIN,   type = rw,  optional = yes;
    BSS:      load = MAIN,   type = bss, optional = yes, define = yes;
}
