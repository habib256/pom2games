# cc65 linker config — Apple II LOGO (APPLE-1 LOGO V2.6, GEN2 HGR build), DOS 3.3
# ------------------------------------------------------------------------------
# One binary BRUN at $4000. HGR page 2 is NOT used: once the //e 80-column
# firmware is on, 80STORE turns PAGE2 into a memory bank switch, so the turtle
# lives on page 1 and page 2's RAM holds the interpreter instead.
#
#   $0000-$004F  Monitor / DOS / 80-column firmware zero page -- untouched
#   $0050-$00FF  ZEROPAGE: interpreter + HGR backend + modules (saved on entry,
#                restored by BYE / Ctrl-RESET, dev/lib/apple2/exit.asm)
#   $0400-$07FF  text page (40 or 80 columns)
#   $0800-$0FFF  BASIC greeting program (HELLO) kept by DOS -- untouched
#   $1000-$1FFF  PROCBSS: control stack + var/proc tables + arrow save (~3.7 KB)
#   $2000-$3FFF  HGR page 1: the turtle screen
#   $4000-$95FF  CODE (the BRUN file), then LINEBUF + BSS
#   $9600-$BFFF  DOS 3.3
#
# Entry: $4000 (logo.o linked first; its CODE starts with `jmp main`).
MEMORY {
    ZP:    start = $0050, size = $00B0, type = rw, define = yes;
    PROC:  start = $1000, size = $1000, type = rw, define = yes;
    MAIN:  start = $4000, size = $5600, type = rw, define = yes, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    CODE:     load = MAIN, type = ro;
    LINEBUF:  load = MAIN, type = bss;
    BSS:      load = MAIN, type = bss, optional = yes;
    PROCBSS:  load = PROC, type = bss;
}
