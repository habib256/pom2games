# cc65 C config — Apple II+ 48 KB / DOS 3.3, hi-res C program (BRUN at $6000)
# -----------------------------------------------------------------------------
# The C twin of apple2_hgr.cfg. Link
# dev/cc65/crt0_apple2.s first.
#
#   $0050-$00FF  ZEROPAGE (C runtime + libs); $00-$4F left to the Monitor
#   $0800-$0FFF  BASIC greeting program (HELLO), kept by DOS — never touched
#   $1000-$11DF  LOWBSS sprite backgrounds; $11E0-$1FFF ASSETS
#   $2000-$5FFF  HGR pages 1 and 2
#   $6000-$93FF  STARTUP..DATA (the BRUN file), then BSS + ZPSAVE
#   $9400-$95FF  C argument stack (512 B, grows down from $9600)
#   $9600-$BFFF  DOS 3.3
FEATURES {
    STARTADDRESS: default = $6000;
    CONDES: type=constructor, label=__CONSTRUCTOR_TABLE__, count=__CONSTRUCTOR_COUNT__, segment=ONCE;
    CONDES: type=destructor,  label=__DESTRUCTOR_TABLE__,  count=__DESTRUCTOR_COUNT__,  segment=RODATA;
    CONDES: type=interruptor, label=__INTERRUPTOR_TABLE__, count=__INTERRUPTOR_COUNT__, segment=RODATA, import=__CALLIRQ__;
}
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0200;
    __STACKSTART__: type = weak, value = $9600;
    __EXIT_RTS__:   type = weak, value = 0;      # 1 = started by CALL, RTS back
}
MEMORY {
    ZP:     start = $0050, size = $00B0, type = rw, define = yes;
    LOWRAM: start = $1000, size = $01E0, type = rw, define = yes, file = "";
    ASSETRAM: start = $11E0, size = $0E20, type = ro, file = "build/assets.bin";
    RAM:    start = $6000, size = $3400, type = rw, define = yes, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    LOWBSS:   load = LOWRAM, type = bss, optional = yes, define = yes;
    ASSETS:   load = ASSETRAM, type = ro;
    STARTUP:  load = RAM,    type = ro,  define = yes;
    LOWCODE:  load = RAM,    type = ro,  optional = yes;
    INIT:     load = RAM,    type = ro,  optional = yes;
    ONCE:     load = RAM,    type = ro,  optional = yes;
    CODE:     load = RAM,    type = ro;
    RODATA:   load = RAM,    type = ro;
    DATA:     load = RAM,    type = rw,  define = yes;
    BSS:      load = RAM,    type = bss, define = yes;
    ZPSAVE:   load = RAM,    type = bss;
}
