# cc65 linker config — Maze 3D for Apple II+ / DOS 3.3 (BRUN binary at $6000)
# ---------------------------------------------------------------------------
#   $0050-$00FF  zero page (game + hgr_text8 + hgr_sprite16), snapshot at start
#                and restored on quit (exit.asm)
#   $0800-$0FFF  left to the BASIC greeting program (HELLO) kept by DOS
#   $1000-$104C  GRID  (maze cells, 11x7)
#   $1050-$109C  STK   (DFS backtracker stack)
#   $10A0-$10FF  MOBS  (monsters table)
#   $2000-$3FFF  HGR page 1 (drawn)       $4000-$5FFF  HGR page 2 (blank flip)
#   $6000-$95FF  CODE (the BRUN file), then BSS (ZP snapshot buffer)
#   $9600-$BFFF  DOS 3.3
# Entry: $6000 (main is the first byte of CODE, maze3d.o linked first).
MEMORY {
    ZP:    start = $0050, size = $00B0, type = rw, define = yes;
    GRID:  start = $1000, size = $0050, type = rw, define = yes;
    STK:   start = $1050, size = $0050, type = rw, define = yes;
    MOBS:  start = $10A0, size = $0060, type = rw, define = yes;
    TEXT:  start = $1100, size = $0F00, type = ro, file = "build/maze3d_text.bin";
    MAIN:  start = $6000, size = $3600, type = rw, define = yes, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    CODE:     load = MAIN, type = ro;
    BSS:      load = MAIN, type = bss, define = yes;
    GRIDSEG:  load = GRID, type = bss;
    STKSEG:   load = STK,  type = bss;
    MOBSEG:   load = MOBS, type = bss;
    NARRATOR: load = TEXT, type = ro;
}
