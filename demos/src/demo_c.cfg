# cc65 C config — DEMO.DSK C demos (BOUNCES, ANIMALS, PRESHIFT)
# -----------------------------------------------------------------------------
# Started by the BASIC menu with BLOAD + CALL 24576, they return to it (RTS on
# the caller's stack, __EXIT_RTS__ = 1). The menu runs MAXFILES 1 first, which
# moves DOS's HIMEM from $9600 to $9AA6 -- that is what makes ANIMALS fit -- and
# HIMEM: 4096, which keeps its strings below $1000.
#
#   $0050-$00FF  ZEROPAGE (C runtime + hgrc)
#   $0800-$0FFF  the BASIC menu (program, variables, strings)   -- untouched
#   $1000-$1FFF  LOWRAM: BSS + LOWBSS + ZPSAVE
#   $2000-$5FFF  HGR pages 1 and 2 (double buffering)
#   $6000-$96A5  STARTUP..DATA (the BLOAD file)
#   $96A6-$9AA5  C argument stack (1 KB, grows down from $9AA6)
#   $9AA6-$BFFF  DOS 3.3 with MAXFILES 1
FEATURES {
    STARTADDRESS: default = $6000;
    CONDES: type=constructor, label=__CONSTRUCTOR_TABLE__, count=__CONSTRUCTOR_COUNT__, segment=ONCE;
    CONDES: type=destructor,  label=__DESTRUCTOR_TABLE__,  count=__DESTRUCTOR_COUNT__,  segment=RODATA;
    CONDES: type=interruptor, label=__INTERRUPTOR_TABLE__, count=__INTERRUPTOR_COUNT__, segment=RODATA, import=__CALLIRQ__;
}
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0400;
    __STACKSTART__: type = weak, value = $9AA6;
    __EXIT_RTS__:   type = weak, value = 1;
}
MEMORY {
    ZP:     start = $0050, size = $00B0, type = rw, define = yes;
    LOWRAM: start = $1000, size = $1000, type = rw, define = yes;
    RAM:    start = $6000, size = $36A6, type = rw, define = yes, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    STARTUP:  load = RAM,    type = ro,  define = yes;
    LOWCODE:  load = RAM,    type = ro,  optional = yes;
    INIT:     load = RAM,    type = ro,  optional = yes;
    ONCE:     load = RAM,    type = ro,  optional = yes;
    CODE:     load = RAM,    type = ro;
    RODATA:   load = RAM,    type = ro;
    DATA:     load = RAM,    type = rw,  define = yes;
    BSS:      load = LOWRAM, type = bss, define = yes;
    LOWBSS:   load = LOWRAM, type = bss, optional = yes, define = yes;
    ZPSAVE:   load = LOWRAM, type = bss;
}
