# Build every disk from scratch, check it matches the committed dist/*.dsk,
# then play MICRO-SOKOBAN levels headless in a2run.
name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cc65 and zlib
        run: sudo apt-get update && sudo apt-get install -y cc65 zlib1g-dev
      - name: Disks match the sources
        run: make check
      - name: MICRO-SOKOBAN levels in a2run
        run: make test
