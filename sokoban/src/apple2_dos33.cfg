# cc65 linker config — Sokoban for Apple II+ / DOS 3.3 (BRUN binary at $4000)
# ---------------------------------------------------------------------------
#   $0080-$009F  zero page (the slice cc65's own apple2 target uses: Applesoft
#                FAC scratch, harmless to clobber, untouched by DOS 3.3 / RWTS)
#   $2000-$3FFF  HGR page 1 (framebuffer)
#   $4000-....   CODE + RODATA + DATA (the BRUN file), then BSS (not in file)
#   $9600-$BFFF  DOS 3.3 — never touched
MEMORY {
    ZP:   start = $0080, size = $0020, type = rw, define = yes;
    MAIN: start = $4000, size = $5600, type = rw, define = yes, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    BSS:      load = MAIN, type = bss, define = yes;
}
