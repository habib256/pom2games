# DIRTBIKE -- Apple II+ 48 KB / DOS 3.3, BRUN at $6000 (dev/cc65/apple2_hgr.cfg
# plus the HELLO area). The game also uses $0800-$0FFF, where the BASIC
# greeting program lies while it runs: tables built at start. On the way
# back to DOS, dirtbike.s empties the BASIC program (as NEW would).
#
#   $0200-$03CF  input buffer and user page, unused (no BASIC, no DOS
#                commands): SYSBSS (hgr_lo / hgr_hi, built at start)
#   $0400-$07FF  text page 1, never shown (no way back to DOS): TXT0..TXT7
#                = its eight 120-byte runs, the screen holes left alone
#                (RWTS and the slot firmware keep their state there)
#   $0800-$0FFF  quarter-square tables (MUL_TABLES, lib/math)
#   $1000-$1FFF  LOWBSS (4 KB)     ground ring, shift tables, row writers
#   $2000-$5FFF  HGR pages 1 and 2
#   $6000-$91FF  the BRUN file, then BSS (zeros in the file: fill = yes)
#   $9200-$95FF  boot code (INIT, the end of the file) and the routines
#                that run in the text page (TXTC5, TXTC7, copied there at boot),
#                then the track's pattern pool (render.inc) over them
MEMORY {
    ZP:     start = $0050, size = $00B0, type = rw, define = yes;
    TXT0:   start = $0400, size = $0078, type = rw;
    TXT1:   start = $0480, size = $0078, type = rw;
    TXT2:   start = $0500, size = $0078, type = rw;
    TXT3:   start = $0580, size = $0078, type = rw;
    TXT4:   start = $0600, size = $0078, type = rw;
    TXT5:   start = $0680, size = $0078, type = rw;
    TXT6:   start = $0700, size = $0078, type = rw;
    TXT7:   start = $0780, size = $0078, type = rw;
    SYSRAM: start = $0200, size = $01D0, type = rw;
    LOWRAM: start = $1000, size = $1000, type = rw, define = yes;
    MAIN:   start = $6000, size = $3200, type = rw, define = yes, file = %O, fill = yes;
    OVL:    start = $9200, size = $0400, type = rw, define = yes, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    TXT0:     load = TXT0,   type = bss, optional = yes;
    TXT1:     load = TXT1,   type = bss, optional = yes;
    TXT2:     load = TXT2,   type = bss, optional = yes;
    TXT3:     load = TXT3,   type = bss, optional = yes;
    TXT4:     load = TXT4,   type = bss, optional = yes;
    TXT5:     load = TXT5,   type = bss, optional = yes;
    TXT6:     load = TXT6,   type = bss, optional = yes;
    TXT7:     load = TXT7,   type = bss, optional = yes;
    SYSBSS:   load = SYSRAM, type = bss, optional = yes;
    LOWBSS:   load = LOWRAM, type = bss, define = yes, optional = yes;
    CODE:     load = MAIN,   type = ro;
    RODATA:   load = MAIN,   type = ro,  optional = yes;
    DATA:     load = MAIN,   type = rw,  optional = yes;
    BSS:      load = MAIN,   type = bss, optional = yes, define = yes;
    INIT:     load = OVL,    type = ro,  define = yes, optional = yes;
    TXTC5:    load = OVL,    run = TXT5, type = rw,  define = yes, optional = yes;
    TXTC7:    load = OVL,    run = TXT7, type = rw,  define = yes, optional = yes;
}
