# DIRTBIKE -- Apple II+ 48 KB / DOS 3.3, BRUN at $6000 (dev/cc65/apple2_hgr.cfg
# plus the HELLO area). The game also uses $0800-$0FFF, where the BASIC
# greeting program lies while it runs: tables built at start. On the way
# back to DOS, dirtbike.s empties the BASIC program (as NEW would).
#
#   $0800-$0FFF  quarter-square tables (MUL_TABLES, lib/math)
#   $1000-$1FFF  LOWBSS (4 KB)     ground ring, shift tables, row writers
#   $2000-$5FFF  HGR pages 1 and 2
#   $6000-$95FF  the BRUN file, then BSS
MEMORY {
    ZP:     start = $0050, size = $00B0, type = rw, define = yes;
    LOWRAM: start = $1000, size = $1000, type = rw, define = yes;
    MAIN:   start = $6000, size = $3600, type = rw, define = yes, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    LOWBSS:   load = LOWRAM, type = bss, define = yes, optional = yes;
    CODE:     load = MAIN,   type = ro;
    RODATA:   load = MAIN,   type = ro,  optional = yes;
    DATA:     load = MAIN,   type = rw,  optional = yes;
    BSS:      load = MAIN,   type = bss, optional = yes, define = yes;
}
