# cc65 linker config -- ROGUE.TMS for Apple II+ 48 KB / DOS 3.3 + E-Z Color card
# ---------------------------------------------------------------------------
#   $0050-$00FF  zero page (game, VDP driver, FOV), DOS's own saved at start
#                and put back on quit / Ctrl-RESET (exit.asm)
#   $0400-$07FF  Apple text page: the "look at the card's monitor" notice
#   $0800-$0FFF  the BASIC greeting program (HELLO), kept by DOS
#   $1000-$13FF  LOWBSS: map_buffer, vis_buffer, monster / item / bag pools
#                (the Apple-1 high bank $E000-$E46F), DOS's zero page copy
#   $2000-$3FFF  unused (HGR page 1: the Apple screen stays in text mode)
#   $4000-$95FF  the BRUN file: STARTUP (entry = first byte), CODE, RODATA,
#                the VDP patch table, then BSS. $4000 = the Apple-1
#                cartridge's own address.
#   $9600-$BFFF  DOS 3.3, kept (ESC returns to it)
MEMORY {
    ZP:     start = $0050, size = $00B0, type = rw, define = yes;
    LOWRAM: start = $1000, size = $1000, type = rw, define = yes;
    MAIN:   start = $4000, size = $5600, type = rw, define = yes, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    LOWBSS:   load = LOWRAM, type = bss, define = yes;
    STARTUP:  load = MAIN,   type = ro;
    CODE:     load = MAIN,   type = ro;
    RODATA:   load = MAIN,   type = ro;
    VDPFIX:   load = MAIN,   type = ro, define = yes;
    BSS:      load = MAIN,   type = bss, define = yes;
}
