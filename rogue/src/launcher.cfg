# cc65 linker config -- ROGUE, the launcher (BRUN ROGUE from HELLO), $6000
#   $0050-       zero page (a few bytes), DOS's saved at start
#   $6000-       STARTUP (entry = first byte), CODE, RODATA, BSS
# It runs DOS's BRUN of ROGUE.TMS ($4000-$76xx) or ROGUE.DHGR: the load
# overwrites the launcher, DOS jumps to the new file and never returns.
MEMORY {
    ZP:     start = $0050, size = $00B0, type = rw, define = yes;
    MAIN:   start = $6000, size = $1000, type = rw, define = yes, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    STARTUP:  load = MAIN, type = ro;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    BSS:      load = MAIN, type = bss, define = yes;
}
