# cc65 linker config -- ROGUE.DHGR for Apple //e 128 KB or //c / DOS 3.3
# ---------------------------------------------------------------------------
#   $0050-$00FF  zero page (game, FOV, DHGR back-end), DOS's own saved at
#                start and put back on quit / Ctrl-RESET (exit.asm)
#   $0800-$0FFF  the BASIC greeting program (HELLO), kept by DOS
#   $1000-$17FF  LOWBSS: map_buffer, vis_buffer, monster / item / bag pools,
#                DOS's zero page copy
#   $1800-$1FFF  DHGRBSS: the virtual TMS9918 VRAM at its own addresses
#                (names $1800-$1AFF, sprite table $1B00-$1B7F), the drawn
#                sprite list, dirty spans, the line buffer
#   $2000-$3FFF  DHGR page 1, main bank (the aux bank's $2000-$3FFF too)
#   $4000-$95FF  the BRUN file: STARTUP (entry = first byte), CODE, RODATA,
#                then BSS
#   $9600-$BFFF  DOS 3.3, kept (ESC returns to it)
# Auxiliary memory: only its DHGR page 1 half is used.
MEMORY {
    ZP:     start = $0050, size = $00B0, type = rw, define = yes;
    LOWRAM: start = $1000, size = $0800, type = rw, define = yes;
    DGRAM:  start = $1800, size = $0800, type = rw, define = yes;
    MAIN:   start = $4000, size = $5600, type = rw, define = yes, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    LOWBSS:   load = LOWRAM, type = bss, define = yes;
    DHGRBSS:  load = DGRAM,  type = bss, define = yes;
    STARTUP:  load = MAIN,   type = ro;
    CODE:     load = MAIN,   type = ro;
    RODATA:   load = MAIN,   type = ro;
    BSS:      load = MAIN,   type = bss, define = yes;
}
