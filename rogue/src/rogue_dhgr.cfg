# cc65 linker config -- ROGUE.DHGR for Apple //e 128 KB or //c
# ---------------------------------------------------------------------------
# DOS 3.3 BRUNs the file at $4000; its start-up code (STARTUP) moves the
# back-end (LCCODE + LCDATA, loaded in $4000-$5FFF) into the language card
# and DOS is given up (the game reboots to leave, rogue_dhgr.s).
#   $0050-$00FF  zero page (game, FOV, DHGR back-end)
#   $0800-$0FFF  DGPAGE: the text engine's state of each DHGR page (page 0's
#                at $0800, page 1's at $0C00); QUIT_MARK at $0FFE
#   $1000-$13FF  LOWBSS: map, visibility, monsters, items, bag, render_map's
#                and the HUD's shadows
#   $1400-$17FF  X2LOW: the cells' half masks (512), the composition buffer
#   $1800-$1FFF  DHGRBSS: the virtual TMS9918 VRAM at its own addresses
#                ($1800 names, $1B00 sprites), the text engine's line buffer
#   $2000-$5FFF  DHGR pages 1 and 2 (main; the aux bank's too)
#   $4000-$5FFF  in the file: STARTUP, then LCCODE + LCDATA (to $D000), padded
#   $6000-$95FF  the file: CODE (the core, start-up hooks), RODATA, DGFIX
#   $9600-$BFFF  (DOS's place) X2IMG: the 8 tile pictures; BSS
#   $D000-$F7FF  language card RAM, bank 2: the back-end (LCCODE, LCDATA)
#   $F800-$FFFF  language card RAM: a copy of the Monitor ROM
# Auxiliary memory: only its halves of the two DHGR pages.
MEMORY {
    ZP:     start = $0050, size = $00B0, type = rw, define = yes;
    DGPG:   start = $0800, size = $0800, type = rw;
    LOWRAM: start = $1000, size = $0400, type = rw, define = yes;
    X2LOWM: start = $1400, size = $0400, type = rw;
    DGRAM:  start = $1800, size = $0800, type = rw, define = yes;
    LOAD:   start = $3C00, size = $2400, type = rw, file = %O, fill = yes;
    MAIN:   start = $6000, size = $3600, type = rw, define = yes, file = %O;
    HIRAM:  start = $9600, size = $2A00, type = rw;
    LCRAM:  start = $D000, size = $2800, type = rw;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    DGPAGE:   load = DGPG,   type = bss;
    LOWBSS:   load = LOWRAM, type = bss, define = yes;
    X2LOW:    load = X2LOWM, type = bss, align = $100;
    DHGRBSS:  load = DGRAM,  type = bss, define = yes;
    STARTUP:  load = LOAD,   type = ro;
    LCCODE:   load = LOAD,   run = LCRAM, type = ro, define = yes;
    LCDATA:   load = LOAD,   run = LCRAM, type = ro, define = yes;
    CODE:     load = MAIN,   type = ro;
    RODATA:   load = MAIN,   type = ro;
    DGFIX:    load = MAIN,   type = ro, define = yes;
    X2IMG:    load = HIRAM,  type = bss, align = $100;
    BSS:      load = HIRAM,  type = bss, define = yes;
}
