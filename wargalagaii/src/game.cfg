# WARGALAGA II: Apple //e enhanced / //c 128K, ProDOS 8, HGR. Game at $6000.
# Main $2000-$5FFF: HGR pages 1 and 2. $1000-$12FF: row tables (ROWS).
# Code/BSS $6000-$BDFF, C stack $BE00-$BEFF, ProDOS globals $BF00.
# Link crt0_prodos.s first. WG2.SYS relocates this image.
# Zero page $D0-$EF: the PT3 player's (src/music.s), $F0-$FF left free.
# AUXM: the PT3 player and song, run in aux memory from $6000 (file %O.mus,
# appended to WG2.AUX); TRAMP: bank-switching trampolines at $1FE0, the
# same bytes copied in main and aux memory. SHOPM: the shop overlay, run at
# $4000 (HGR page 2) when the shop opens (file %O.shop, WG2.AUX at $7000);
# Memory Station is in it too (lot 8), then the title screen (FRONT, lot 9:
# the shop copies only up to DUET). LOWM: Meteor Storm's logic and the
# demo's player and the pickup texts, resident at $0800 (crt0 keeps $0800-$0FFF; file %O.low,
# WG2.AUX at $9000, copied there at boot).
FEATURES {
    STARTADDRESS: default = $6000;
    CONDES: type=constructor, label=__CONSTRUCTOR_TABLE__, count=__CONSTRUCTOR_COUNT__, segment=ONCE;
    CONDES: type=destructor,  label=__DESTRUCTOR_TABLE__,  count=__DESTRUCTOR_COUNT__,  segment=RODATA;
    CONDES: type=interruptor, label=__INTERRUPTOR_TABLE__, count=__INTERRUPTOR_COUNT__, segment=RODATA, import=__CALLIRQ__;
}
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0100;
    __STACKSTART__: type = weak, value = $BF00;
}
MEMORY {
    ZP:     start = $0050, size = $0080, type = rw, define = yes;
    LOWRAM: start = $1000, size = $0FE0, type = rw, define = yes;
    TRAMPM: start = $1FE0, size = $0020, type = rw;
    AUXM:   start = $6000, size = $1000, type = rw, define = yes, file = "%O.mus";
    SHOPM:  start = $4000, size = $2000, type = rw, define = yes, file = "%O.shop";
    LOWM:   start = $0800, size = $0800, type = rw, define = yes, file = "%O.low";
    RAM:    start = $6000, size = $5E00, type = rw, define = yes, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    ROWS:     load = LOWRAM, type = bss, align=$100;
    IOBUF:    load = LOWRAM, type = bss, align=$100, optional = yes;
    LOWBSS:   load = LOWRAM, type = bss, align=$20, optional = yes, define = yes;
    STARTUP:  load = RAM,    type = ro,  define = yes;
    LOWCODE:  load = RAM,    type = ro,  optional = yes;
    INIT:     load = RAM,    type = ro,  optional = yes;
    ONCE:     load = RAM,    type = ro,  optional = yes;
    CODE:     load = RAM,    type = ro;
    RODATA:   load = RAM,    type = ro;
    TRAMP:    load = RAM, run = TRAMPM, type = ro, define = yes;
    DATA:     load = RAM,    type = rw,  define = yes;
    BSS:      load = RAM,    type = bss, define = yes;
    ZPSAVE:   load = RAM,    type = bss;
    AUXMUS:   load = AUXM,   type = rw;
    AUXSONG:  load = AUXM,   type = ro, align = $100;
    SHOP:     load = SHOPM,  type = ro;
    DUET:     load = SHOPM,  type = rw, align = $100, define = yes;
    FRONT:    load = SHOPM,  type = rw;
    STORM:    load = LOWM,   type = ro;
    DEMO:     load = LOWM,   type = ro;
    PICK:     load = LOWM,   type = ro;
}
