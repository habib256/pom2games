# WARGALAGA II: Apple //e enhanced / //c 128K, ProDOS 8, HGR. Game at $6000.
# Main $2000-$5FFF: HGR pages 1 and 2. $1000-$12FF: row tables (ROWS).
# Code/BSS $6000-$BDE4, crt0's ZP save $BDE5-$BEFF (no C code: the C stack
# page is free; 2026-10-30), ProDOS globals $BF00.
# Link crt0_prodos.s first. WG2.SYS relocates this image.
# Zero page $D0-$EF: the PT3 player's (src/music.s), $F0-$FF left free.
# AUXM: the PT3 player and song, run in aux memory from $2000 (file %O.mus,
# first in WG2.AUX; facing HGR page 1, never main code: a test's until on a
# main label cannot stop inside the music's interrupt, 2026-10-30); TRAMP: bank-switching trampolines at $1FE0, the
# same bytes copied in main and aux memory. SHOPM: the shop overlay, run at
# $4000 (HGR page 2) when the shop opens (file %O.shop, WG2.AUX at $7000);
# Memory Station is in it too (lot 8), then the title screen (FRONT, lot 9:
# the shop copies only up to DUET). LOWM: Meteor Storm's logic and the
# demo's player, pickup texts and three dive paths, resident at $0800
# (crt0 keeps $0800-$0FFF; file %O.low,
# WG2.AUX at $9000, copied there at boot). LOWHI: data (and code) resident
# at $1C40-$1FDF, after LOWBSS (lot 10: main RAM was full; file %O.hi,
# WG2.AUX at $9800, copied there at boot). AUXLV: the level records, left
# in aux memory at $9C00 (file %O.lv): setup_level copies one.
# LOW2 (lot 11): more resident code and data at $0200-$03CF (pages 2-3 up
# to ProDOS's vectors; file %O.low2, WG2.AUX at $B900, copied there at boot
# by low_boot). AUXPK: the pickup texts, left in aux memory at $B600 (file
# %O.pick): render.s fetches the one it shows (pick_fetch).
FEATURES {
    STARTADDRESS: default = $6000;
    CONDES: type=constructor, label=__CONSTRUCTOR_TABLE__, count=__CONSTRUCTOR_COUNT__, segment=ONCE;
    CONDES: type=destructor,  label=__DESTRUCTOR_TABLE__,  count=__DESTRUCTOR_COUNT__,  segment=RODATA;
    CONDES: type=interruptor, label=__INTERRUPTOR_TABLE__, count=__INTERRUPTOR_COUNT__, segment=RODATA, import=__CALLIRQ__;
}
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0100;
    __STACKSTART__: type = weak, value = $BF00;
}
MEMORY {
    ZP:     start = $0050, size = $0080, type = rw, define = yes;
    LOWRAM: start = $1000, size = $0FE0, type = rw, define = yes;
    TRAMPM: start = $1FE0, size = $0020, type = rw;
    AUXM:   start = $2000, size = $1000, type = rw, define = yes, file = "%O.mus";
    SHOPM:  start = $4000, size = $2000, type = rw, define = yes, file = "%O.shop";
    LOWM:   start = $0800, size = $0800, type = rw, define = yes, file = "%O.low";
    LOWHI:  start = $1C40, size = $03A0, type = rw, define = yes, file = "%O.hi";
    AUXLV:  start = $9C00, size = $0600, type = rw, define = yes, file = "%O.lv";
    LOW2:   start = $0200, size = $01D0, type = rw, define = yes, file = "%O.low2";
    AUXPK:  start = $B600, size = $0300, type = rw, define = yes, file = "%O.pick";
    # text page 1, never shown in play: 8 x 120 bytes between the screen
    # holes (slot firmware's) for render.s's records (2026-10-30)
    TXT0:   start = $0400, size = $0078, type = rw;
    TXT1:   start = $0480, size = $0078, type = rw;
    TXT2:   start = $0500, size = $0078, type = rw;
    TXT3:   start = $0580, size = $0078, type = rw;
    TXT4:   start = $0600, size = $0078, type = rw;
    TXT5:   start = $0680, size = $0078, type = rw;
    TXT6:   start = $0700, size = $0078, type = rw;
    TXT7:   start = $0780, size = $0078, type = rw;
    # boot-only code, run where LOWBSS will be (file %O.boot, in WG2.SYS:
    # startup.s copies it; 2026-10-30)
    BOOTM:  start = $1700, size = $0510, type = rw, define = yes, file = "%O.boot";
    RAM:    start = $6000, size = $5DE5, type = rw, define = yes, file = %O;
    ZPS:    start = $BDE5, size = $011B, type = rw;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    ROWS:     load = LOWRAM, type = bss, align=$100;
    IOBUF:    load = LOWRAM, type = bss, align=$100, optional = yes;
    LOWBSS:   load = LOWRAM, type = bss, align=$20, optional = yes, define = yes;
    STARTUP:  load = RAM,    type = ro,  define = yes;
    LOWCODE:  load = RAM,    type = ro,  optional = yes;
    INIT:     load = RAM,    type = ro,  optional = yes;
    ONCE:     load = RAM,    type = ro,  optional = yes;
    TIMING:   load = RAM,    type = ro;
    CODE:     load = RAM,    type = ro;
    RODATA:   load = RAM,    type = ro;
    TRAMP:    load = BOOTM, run = TRAMPM, type = ro, define = yes;
    BOOT:     load = BOOTM,  type = rw;
    DATA:     load = RAM,    type = rw,  define = yes;
    BSS:      load = RAM,    type = bss, define = yes;
    ZPSAVE:   load = ZPS,    type = bss;
    AUXMUS:   load = AUXM,   type = rw;
    AUXSONG:  load = AUXM,   type = ro, align = $100;
    SHOP:     load = SHOPM,  type = ro;
    DUET:     load = SHOPM,  type = rw, align = $100, define = yes;
    FRONT:    load = SHOPM,  type = rw;
    STORM:    load = LOWM,   type = ro;
    DEMO:     load = LOWM,   type = ro;
    PICK:     load = AUXPK,  type = ro;
    FLIGHT:   load = LOW2,   type = ro;
    STORM2:   load = LOW2,   type = ro;
    HIDATA:   load = LOWHI,  type = ro;
    TXT0:     load = TXT0,   type = bss, optional = yes;
    TXT1:     load = TXT1,   type = bss, optional = yes;
    TXT2:     load = TXT2,   type = bss, optional = yes;
    TXT3:     load = TXT3,   type = bss, optional = yes;
    TXT4:     load = TXT4,   type = bss, optional = yes;
    TXT5:     load = TXT5,   type = bss, optional = yes;
    TXT6:     load = TXT6,   type = bss, optional = yes;
    TXT7:     load = TXT7,   type = bss, optional = yes;
    LEVELS:   load = AUXLV,  type = ro;
}
