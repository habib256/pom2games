# cc65 linker config — Chess for Apple II+ / DOS 3.3 (BRUN binary at $6000)
# ---------------------------------------------------------------------------
#   $0050-$00FF  zero page (front-end + engine ce_* slots); $00-$4F is left to
#                the Monitor so COUT / HOME work for the mode menu
#   $0800-$0FFF  left to the BASIC greeting program (HELLO) kept by DOS
#   $1000-$13FF  BSS       (renderer + game-loop scratch)
#   $1400-$14FF  BOARDST   (engine board + game state + AI/search scratch)
#   $2000-$3FFF  HGR page 1 (written via STA, not a segment)
#   $6000-$95FF  CODE + ENGINE (the BRUN file)
#   $9600-$BFFF  DOS 3.3
# Entry: $6000 (main is the first byte of CODE, chess.o linked first).
MEMORY {
    ZP:      start = $0050, size = $00B0, type = rw, define = yes;
    BSS:     start = $1000, size = $0400, type = rw, define = yes;
    BOARDST: start = $1400, size = $0100, type = rw, define = yes;
    MAIN:    start = $6000, size = $3600, type = ro, define = yes, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    CODE:     load = MAIN,    type = ro;
    ENGINE:   load = MAIN,    type = ro;
    BSS:      load = BSS,     type = bss;
    BOARDST:  load = BOARDST, type = bss;
}
