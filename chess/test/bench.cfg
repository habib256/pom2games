# ld65 config for the engine bench: same memory map as ../src/chess.cfg.
MEMORY {
    ZP:      start = $0050, size = $00B0, type = rw, define = yes;
    BSS:     start = $1000, size = $0400, type = rw, define = yes;
    BOARDST: start = $1400, size = $0100, type = rw, define = yes;
    MAIN:    start = $6000, size = $3600, type = ro, define = yes, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    CODE:     load = MAIN,    type = ro;
    ENGINE:   load = MAIN,    type = ro;
    BSS:      load = BSS,     type = bss;
    BOARDST:  load = BOARDST, type = bss;
}
