# DOS 3.3 / Apple II+ 48 KB. HELLO issues MAXFILES 1 (HIMEM $9AA6).
# The bootstrap at $0800 is disposable. MAXFILES 1 leaves HIMEM at $9AA6;
# the resident stays below $9AA0 so the DOS buffers at HIMEM are untouched.
# SOL holds the solution reader. It is not in the resident: MICROSOL's first
# two sectors are copied over the level pack (already decoded) and called.
# Both HGR pages remain available; RWTS uses the hidden page as I/O scratch.
# The resident is full: buffers that fit go below it. The GETLN buffer at
# $0200 is free while the game runs (RWTS only, no DOS command), and DOS keeps
# only $03D0-$03FF of page 3.
MEMORY {
    ZP:      start = $0050, size = $00B0, type = rw, define = yes;
    PAGE2:   start = $0200, size = $0100, type = rw;
    PAGE3:   start = $0300, size = $00D0, type = rw;
    WORKRAM: start = $0800, size = $0800, type = rw, define = yes;
    LOWRAM:  start = $1000, size = $1000, type = rw, define = yes;
    MAIN:    start = $6000, size = $3AA0, type = rw, define = yes, file = %O;
    SOL:     start = $1004, size = $01FC, type = ro, file = "build/solcode.bin";
}
SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    PAGE2BSS: load = PAGE2,   type = bss;
    PAGE3BSS: load = PAGE3,   type = bss;
    WORKBSS:  load = WORKRAM, type = bss, define = yes;
    LOWBSS:   load = LOWRAM,  type = bss, optional = yes, define = yes;
    CODE:     load = MAIN,    type = ro;
    RODATA:   load = MAIN,    type = ro, optional = yes;
    DATA:     load = MAIN,    type = rw, optional = yes;
    BSS:      load = MAIN,    type = bss, optional = yes, define = yes;
    SOLCODE:  load = SOL,     type = ro, optional = yes;
}
