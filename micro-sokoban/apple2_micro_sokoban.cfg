# DOS 3.3 / Apple II+ 48 KB. HELLO issues MAXFILES 1 (HIMEM $9AA6).
# The bootstrap at $0800 is disposable; the resident stays below $9A00.
# Both HGR pages remain available; RWTS uses the hidden page as I/O scratch.
MEMORY {
    ZP:      start = $0050, size = $00B0, type = rw, define = yes;
    WORKRAM: start = $0800, size = $0800, type = rw, define = yes;
    LOWRAM:  start = $1000, size = $1000, type = rw, define = yes;
    MAIN:    start = $6000, size = $3A00, type = rw, define = yes, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    WORKBSS:  load = WORKRAM, type = bss, define = yes;
    LOWBSS:   load = LOWRAM,  type = bss, optional = yes, define = yes;
    CODE:     load = MAIN,    type = ro;
    RODATA:   load = MAIN,    type = ro, optional = yes;
    DATA:     load = MAIN,    type = rw, optional = yes;
    BSS:      load = MAIN,    type = bss, optional = yes, define = yes;
}
