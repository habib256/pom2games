# ld65 config: one output file per region of the load table.
MEMORY {
    M0800: start = $0800, size = $1500, file = "build/seg_0800.bin", fill = yes;
    M2000: start = $2000, size = $2000, file = "build/seg_2000.bin", fill = yes;
    M6000: start = $6000, size = $1E00, file = "build/seg_6000.bin", fill = yes;
    M9400: start = $9400, size = $0700, file = "build/seg_9400.bin", fill = yes;
    MA000: start = $A000, size = $1100, file = "build/seg_A000.bin", fill = yes;
    LCRUN: start = $D000, size = $1100, file = "";
}
SEGMENTS {
    MAIN:   load = M0800, type = rw;
    HGRBG:  load = M2000, type = ro;
    TABLES: load = M6000, type = ro;
    BOXES:  load = M9400, type = rw;
    LCDATA: load = MA000, run = LCRUN, type = ro;
}
