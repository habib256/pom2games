# ROBOT SPACE STATION: dev/cc65/apple2_dhgr_prodos_c.cfg plus HI, the unused
# DHGR page 2 in main RAM ($4000-$5FFF), for zone.c and title.c (startup.s
# copies game.bin.hi there). The game draws on page 1 only.
# Main/aux $2000-$5FFF: DHGR. Main $1000-$1FFF: LOWBSS. Main $0800-$0FFF
# (marked used in ProDOS's bitmap by crt0, free once RSS.SYSTEM has run):
# $0800-$0C3F crt0's zero-page save, drone B's board (src/swap.s) and the
# pointer's shapes (not zeroed); $0C40-$0FFF L8, sprites.c's code (startup.s
# copies game.bin.low there).
# Code/BSS $6000-$BE7F, C stack $BE80-$BEFF, ProDOS globals $BF00.
# The deepest measured C stack use is 18 bytes (records, ProDOS, play):
# 128 keep a wide margin (the game's functions use static locals).
# Link crt0_prodos.s first. CHROMA.SYS relocates this image.
FEATURES {
    STARTADDRESS: default = $6000;
    CONDES: type=constructor, label=__CONSTRUCTOR_TABLE__, count=__CONSTRUCTOR_COUNT__, segment=ONCE;
    CONDES: type=destructor,  label=__DESTRUCTOR_TABLE__,  count=__DESTRUCTOR_COUNT__,  segment=RODATA;
    CONDES: type=interruptor, label=__INTERRUPTOR_TABLE__, count=__INTERRUPTOR_COUNT__, segment=RODATA, import=__CALLIRQ__;
}
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0080;
    __STACKSTART__: type = weak, value = $BF00;
}
MEMORY {
    ZP:     start = $0050, size = $00B0, type = rw, define = yes;
    LOW8:   start = $0800, size = $0440, type = rw, define = yes;
    L8:     start = $0C40, size = $03C0, type = rw, define = yes, file = "%O.low";
    LOWRAM: start = $1000, size = $1000, type = rw, define = yes;
    RAM:    start = $6000, size = $5E80, type = rw, define = yes, file = %O;
    HI:     start = $4000, size = $2000, type = rw, define = yes, file = "%O.hi";
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    IOBUF:    load = LOWRAM, type = bss, align=$100, optional = yes;
    LOWBSS:   load = LOWRAM, type = bss, align=$20, optional = yes, define = yes;
    STARTUP:  load = RAM,    type = ro,  define = yes;
    # Page-aligned PWM player (lib/audio), right after crt0's fixed STARTUP:
    # a constant pad instead of 0..255 bytes after a CODE of any length.
    AUDIOCODE: load = RAM, type = ro, align = $100, optional = yes;
    LOWCODE:  load = RAM,    type = ro,  optional = yes;
    INIT:     load = RAM,    type = ro,  optional = yes;
    ONCE:     load = RAM,    type = ro,  optional = yes;
    CODE:     load = RAM,    type = ro;
    RODATA:   load = RAM,    type = ro;
    DATA:     load = RAM,    type = rw,  define = yes;
    BSS:      load = RAM,    type = bss, define = yes;
    ZPSAVE:   load = LOW8,   type = bss;
    LOW8BSS:  load = LOW8,   type = bss, optional = yes;
    HICODE:   load = HI,     type = ro;
    HIDATA:   load = HI,     type = ro;
    L8CODE:   load = L8,     type = ro;
    L8DATA:   load = L8,     type = ro;
}
